---
name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索 [已有 Issues](https://github.com/wuhulab/Graw/issues) 确认没有重复。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点/场景？为什么会需要它？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你设想的行为、交互或数据结构（有具体例子更好）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你尝试过的替代做法，或其它可接受的折中方案
  - type: input
    id: reference
    attributes:
      label: 参考实现
      description: 同类面板（1Panel / 宝塔 / Cockpit 等）中类似功能的截图或链接