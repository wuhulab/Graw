name: 功能请求
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题 / 使用场景
      description: 描述当前痛点或你希望解决的场景，避免直接下结论
      placeholder: 例如：当我需要同时管理多台服务器时，…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你期望的行为或界面变化
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他面板 / 手动操作等方式如何做（可选）

  - type: checkboxes
    id: effort
    attributes:
      label: 是否愿意参与实现
      options:
        - label: 我可以提交 PR 协助实现该功能
        - label: 我只需要该功能，交由维护者评估