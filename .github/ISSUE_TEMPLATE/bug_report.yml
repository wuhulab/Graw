# 使用 GitHub Issue 表单（YAML）：https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests
name: Bug 报告
description: 提交缺陷报告，帮助我们定位问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量提供完整信息，必要时会引导补全。
        > 安全问题请勿在此公开披露，按 [SECURITY.md](../../SECURITY.md) 私有报告。

  - type: input
    id: version
    attributes:
      label: 面板版本
      description: 后端 APP_VERSION 或 Docker 镜像标签（如 1.5.2 / latest）
      placeholder: 例如 1.5.2
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker 完整宿主机模式（README 推荐方式）
        - 本地开发（backend + frontend 分离）
        - 其他（请在描述中说明）
      default: 0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 宿主系统
      description: 操作系统与版本；远程子节点请一并写明
      placeholder: 例如 Ubuntu 22.04 / Windows Server 2022
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何一步步触发该问题
      placeholder: |
        1. 打开「X」窗口
        2. 点击「Y」
        3. 观察到错误…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 报错信息、浏览器控制台输出、后端日志等
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、相关配置（注意脱敏：勿粘贴密码 / Token / 私钥）