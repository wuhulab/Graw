# ============================================================
# Graw Server Panel - 自动构建 Docker 镜像并发布到 Docker Hub
#
# 触发方式:
#   1. 打版本 tag (v1.2.3)        -> 构建并推送 :1.2.3 与 :latest
#   2. 手动触发 (Actions 页面)    -> 按需构建
#
# 说明: 仅当发布 Release（打 tag）时才触发构建，普通代码推送到
#       main 分支不会触发。tag 格式为 v 开头，如 v1.0.0。
#
# 所需仓库 Secrets（Settings -> Secrets and variables -> Actions）:
#   DOCKERHUB_USERNAME   Docker Hub 用户名
#   DOCKERHUB_TOKEN       Docker Hub 访问令牌（Access Token，非登录密码）
# ============================================================

name: Docker Build & Publish

# 触发事件配置：仅 tag 与手动触发，不响应普通分支推送
on:
  push:
    tags:
      - 'v*'            # 版本 tag，如 v1.0.0
  workflow_dispatch:    # 支持手动触发

env:
  # 镜像命名空间与仓库名（对应 Docker Hub 仓库 shunx/graw）
  IMAGE_NAME: shunx/graw

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # 权限：读取代码 + 写入包/内容
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 准备 Docker 多架构构建环境 (buildx)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 启用 QEMU 模拟器（仅后端 runtime 阶段按目标平台构建 arm64 时需要）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. 登录 Docker Hub（使用仓库 Secrets 中的令牌）
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 生成镜像标签
      #    - tag 推送 (v1.2.3)   -> 1.2.3 和 latest
      - name: Generate image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "tags=${{ env.IMAGE_NAME }}:${version},${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      # 6. 构建并推送镜像（多架构：amd64 + arm64）
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          # 双缓存：gha 缓存 + 基于镜像仓库的 registry 缓存。
          # registry 缓存可跨构建持久复用依赖层（node_modules / pip），
          # 后续版本构建会直接跳过 npm install / pip install，速度大幅提升。
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: mode=max
          sbom: true

      # 7. 输出构建摘要（镜像 digest、标签等）
      - name: Build summary
        run: |
          echo "## 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "镜像标签: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "构建时间: \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\`" >> "$GITHUB_STEP_SUMMARY"
