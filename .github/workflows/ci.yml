# ============================================================
# Graw CI —— 每次 push / PR 自动执行的检查
#
# 包含两个相互独立的 job（任一失败不影响另一个产出结果）：
#   1. backend   : Python 语法体检 + 后端健康回归测试（pytest）
#   2. frontend  : 前端依赖安装 + 生产构建（vite build）
#
# 说明：
#   - 测试集仅纳入「可移植、无需真实系统环境」的 pytest 回归文件。
#   - test_agent_cfg_unit.py 因断言仍使用旧版 set_config(role=...) 签名、
#     与当前代码不同步（本地已知 2 项失败），暂不纳入 CI；
#     待其与 agent_cfg.set_config() 同步后再加入。
#   - pytest 与 httpx 属于「测试期依赖」，未写入 requirements.txt（运行时不
#     需要）；其中 httpx 是 starlette.testclient 的必需项，缺失会导致
#     FastAPI TestClient 在收集阶段直接报错，故在 CI 中显式安装。
#   - Docker 镜像构建发布见 docker-publish.yml（仅打 tag 触发）。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需读取代码
permissions:
  contents: read

jobs:
  backend:
    name: Backend check & test
    runs-on: ubuntu-latest
    # 上限时长，防止依赖安装卡死导致任务长时间占用
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          # pytest = 测试运行器；httpx = starlette.testclient 的必需依赖
          pip install pytest httpx

      - name: Syntax check (compileall)
        run: python -m compileall -q backend/app

      - name: Run regression tests (pytest)
        working-directory: backend
        run: python -m pytest test_security_regression.py test_frp_configpath_regression.py -q --tb=short

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build