# ============================================================
# Graw Server Panel - CodeQL 静态安全扫描
#
# 功能:
#   - 使用 GitHub 官方 CodeQL 引擎扫描代码中的安全漏洞
#     （SQL 注入、命令注入、路径穿越、XSS 等）
#   - 覆盖后端 Python 与前端 JavaScript/TypeScript 两种语言
#   - 默认启用 security-and-quality 查询集（安全 + 质量）
#
# 触发方式:
#   1. push 到 main 分支
#   2. 打开/更新 Pull Request（目标为 main）
#   3. 每周日 UTC 0 点定时扫描（防止漏掉空闲期新增代码）
#   4. 手动触发 (Actions 页面)
#
# 结果查看:
#   扫描完成后到仓库 Security -> Code scanning alerts 查看告警
#   CodeQL 是 public 仓库的免费能力，无需额外付费。
# ============================================================

name: "CodeQL"

# 触发事件配置
on:
  push:
    branches: ["main"]        # push 到主分支时扫描
  pull_request:
    branches: ["main"]        # PR 提交到主分支时扫描
  schedule:
    - cron: "0 0 * * 0"       # 每周日 UTC 0 点（北京时间周日 8:00）
  workflow_dispatch:          # 支持手动触发

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360      # CodeQL 分析上限时长，防止任务挂死
    permissions:
      contents: read          # 读取代码
      security-events: write  # 写入安全告警
      actions: read           # 读取 action 运行状态
      packages: read          # 读取包元数据

    strategy:
      # 不采用 fail-fast：两种语言其中一个失败不影响另一个产出结果
      fail-fast: false
      matrix:
        include:
          # Python 后端：解释器模式分析，无需构建步骤
          - language: python
            build-mode: none
          # 前端 JS/TS：CodeQL 自动解析构建，无需手动构建
          - language: javascript-typescript
            build-mode: none

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 初始化 CodeQL（指定要分析的语言与查询集）
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality：安全告警 + 常见质量告警（比默认更全）
          queries: security-and-quality

      # 3. 执行 CodeQL 分析（自动上传告警到 Security 页签）
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          # 按语言分类告警，便于在仓库安全页分别查看
          category: "/language:${{matrix.language}}"